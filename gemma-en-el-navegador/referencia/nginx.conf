# Sirve la solución estática del taller. No hay llaves ni datos en el servidor:
# Gemma corre en el navegador de cada visitante y cada quien usa su propia llave.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
  }

  # Las pruebas, el servidor local y el package.json no son parte de la página.
  location ~ ^/(pruebas|package\.json|servir\.py) { return 404; }
}
